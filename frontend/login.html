<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for existing user</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="page">
        <div class="navbar2">
            <a href="index.html" class="nav-btn">Home Page</a>
            <a href="donor_registration.html" class="nav-btn">Food Donor</a>
            <a href="ngo_registration.html" class="nav-btn">Food Receiver</a>
        </div>
        <div class="login-box">
            <form id="loginForm">
                <h1>LOGIN FOR EXISTING USERS</h1>
                <table>
                    <tr><td>User ID:<input type="text" id="userid" placeholder="Enter User ID" required></td></tr>
                    <tr><td>User Name:<input type="text" id="username" name="username" placeholder="Enter Username" required></td></tr>
                    <tr><td>Password:<input type="password" id="password" name="password" placeholder="Enter Password" required></td></tr>
                    <tr><td>Email:<input type="email" id="email" name="email" placeholder="Enter Email ID" required></td></tr>
                </table>
                <h4>Not a user? Then register yourself first according to <a href="donor_registration.html">Food Donor</a> and <a href="ngo_registration.html">Food Receiver</a></h4>
                <p id="loginError" style="color:red; text-align:center;"></p>
                <button type="submit" id="loginButton">Submit</button>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
