<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for existing user</title>
    <link rel="stylesheet" href="css/login.css">
    
</head>

<body>
   <form id="loginForm">
        <table>
            <h1>LOGIN FOR EXISTING USERS</h1>

            <tr>
                <td>
                <input
    type="text"
    id="userid"
    name="userid"
    placeholder="Enter User ID (DN001 / RN001)"
    required>
                </td>
            </tr>
            <tr>
                <td>User Name: <input type="text" id="username" name="username" placeholder="Enter Username" required>
                </td>
            </tr>
            <tr>
                <td>Password: <input type="text" id="password" name="password" placeholder="Enter Password" required>
                </td>
            </tr>
            <tr>
                <td>Email: <input type="email" id="Email:" name="Email:" placeholder="Enter Email ID" required></td>
            </tr>
        </table>

        <h4>Not a user ? Then register yourself first according to <a href="donor_registration.html">Food
                Donor</a>
            and <a href="ngo_registration.html">Food Reciver</a> </h4>
        <button>Submit</button>
    </form>
<script src="js/login.js"></script>

</body>

</html>
