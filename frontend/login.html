<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for existing user</title>
    <link rel="stylesheet" href="css/login.css">

</head>

<body>


    <div class="page">

        <div class="navbar2">
            <a href="index.html" class="nav-btn">Home Page</a>
            <a href="donor_registration.html" class="nav-btn">Food Donor</a>
            <a href="ngo_registration.html" class="nav-btn">Food Receiver</a>
        </div>

        <div class="login-box">
            <form id="loginForm">
                <table>
                    <h1>LOGIN FOR EXISTING USERS</h1>

                    <tr>
                        <td>
                            User ID:<input type="text" id="userid" placeholder="Enter User ID" required>

                        </td>
                    </tr>
                    <tr>
                        <td>User Name: <input type="text" id="username" name="username" placeholder="Enter Username"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Password: <input type="password" id="password" name="password" placeholder="Enter Password"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Email: <input type="email" id="Email:" name="Email:" placeholder="Enter Email ID" required>
                        </td>
                    </tr>
                </table>

                <h4>Not a user ? Then register yourself first according to <a href="donor_registration.html">Food
                        Donor</a>
                    and <a href="ngo_registration.html">Food Reciver</a> </h4>
                <button>Submit</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {

            e.preventDefault();

            const userid = document.getElementById("userid").value.trim().toUpperCase();
            const password = document.getElementById("password").value;

            try {

                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        userid: userid,
                        password: password
                    })
                });

                const result = await response.json();

                console.log("Login response:", result);

                if (result.success) {

                    // ==========================================
                    // SAVE LOGGED-IN USER ID
                    // ==========================================

                    localStorage.setItem("user_id", userid);

                    console.log(
                        "Saved User ID:",
                        localStorage.getItem("user_id")
                    );


                    alert("Login Successful!");


                    // ==========================================
                    // DONOR
                    // ==========================================

                    if (userid.startsWith("DN")) {

                        window.location.href =
                            "donor/donor_dashboard.html";

                    }


                    // ==========================================
                    // FOOD RECEIVER / NGO
                    // ==========================================

                    else if (userid.startsWith("RN")) {

                        window.location.href =
                            "receiver/receiver_dashboard.html";

                    }


                    else {

                        alert("Invalid User ID.");

                    }

                }

                else {

                    alert(
                        result.message ||
                        "Invalid User ID or Password."
                    );

                }

            }

            catch (error) {

                console.error(
                    "Login Error:",
                    error
                );

                alert(
                    "Cannot connect to server. " +
                    "Please make sure app.py is running."
                );

            }

        });
    </script>
</body>

</html>
