<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accepted Food | HungerFree</title>

    <link rel="stylesheet" href="receiver.css?v=2">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>🍽 HungerFree</h2>

        <a href="receiver_dashboard.html">
            🏠 Dashboard
        </a>

        <a href="available_food.html">
            🍱 Available Food
        </a>

        <a href="accepted_food.html" class="active">
            ✔ Accepted Food
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <a href="../login.html" id="logoutBtn">
            🚪 Logout
        </a>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <h1>
            Accepted Food
        </h1>

        <p>
            Manage all accepted food donations.
        </p>


        <!-- Search & Filter -->

        <div class="top-controls">

            <input type="text" id="searchDonation" placeholder="Search Donation">


            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="Approved">
                    Approved
                </option>

                <option value="Picked Up">
                    Picked Up
                </option>

            </select>

        </div>


        <!-- Table -->

        <table>

            <thead>

                <tr>

                    <th>
                        Donation ID
                    </th>

                    <th>
                        Restaurant
                    </th>

                    <th>
                        Food
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Pickup Time
                    </th>

                    <th>
                        Contact
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="acceptedFoodBody">

                <tr>

                    <td colspan="8">
                        Loading accepted donations...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <script src="../js/accepted_food.js"></script>

</body>

</html>
