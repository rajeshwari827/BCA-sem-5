<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Food | HungerFree</title>

    <link rel="stylesheet" href="receiver.css?v=2">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>🍽 HungerFree</h2>

        <a href="receiver_dashboard.html">
            🏠 Dashboard
        </a>

        <a href="available_food.html" class="active">
            🍱 Available Food
        </a>

        <a href="accepted_food.html">
            ✔ Accepted Food
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <a href="../login.html" id="logoutBtn">
            🚪 Logout
        </a>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <h1>
            Available Food
        </h1>

        <p>
            View all available food donations from donors.
        </p>


        <!-- Search & Filter -->

        <div class="top-controls">

            <input type="text" id="searchFood" placeholder="Search Food">


            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="Veg">
                    Veg
                </option>

                <option value="Non-Veg">
                    Non-Veg
                </option>

                <option value="Bakery">
                    Bakery
                </option>

                <option value="Beverages">
                    Beverages
                </option>

                <option value="Packed Food">
                    Packed Food
                </option>

                <option value="Cooked Food">
                    Cooked Food
                </option>

                <option value="Raw Food">
                    Raw Food
                </option>

            </select>


            <select id="cityFilter">

                <option value="">
                    All Cities
                </option>

            </select>

        </div>


        <!-- Food Table -->

        <table>

            <thead>

                <tr>

                    <th>
                        Restaurant
                    </th>

                    <th>
                        Food
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Cooking Time
                    </th>

                    <th>
                        Pickup Address
                    </th>

                    <th>
                        Contact
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="availableFoodBody">

                <tr>

                    <td colspan="9">
                        Loading available food...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <script src="../js/available_food.js"></script>

</body>

</html>
