<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Receiver</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="page">

        <div class="navbar2">
            <a href="index.html" class="nav-btn">Home Page</a>
            <a href="login.html" class="nav-btn">Login</a>
            <a href="donor_registration.html" class="nav-btn">Food Donor</a>
        </div>
        <div class="login-box">

            <h1>LOGIN AS RECEIVER</h1>
            <form>
                <table>

                    <tr>
                        <td>Receiver ID: <input type="text" id="userId" name="userId" placeholder="Enter Receiver ID"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Organization Name: <input type="text" id="placeName" name="placeName"
                                placeholder="Enter Name of Organization" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Organization Type: <input type="text" id="placeType" name="placeType"
                                placeholder="Enter Type of Organization" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Representative Name: <input type="text" id="RepresentativeName" name="RepresentativeName"
                                placeholder="Enter Name of Representative" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Email ID: <input type="email" id="Email" name="Email" placeholder="Enter Email ID" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Phone number: <input type="text" id="phone no" name="phone no"
                                placeholder="Enter Phone number" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Address: <input type="textarea" id="address" name="address" placeholder="Enter your address"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>City: <input type="text" id="city" name="city" placeholder="Enter your city" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Password: <input type="text" id="password" name="password" placeholder="Enter Password"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Confirm Password: <input type="text" id="conform password" name="conform password"
                                placeholder="Enter Conform Password" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Location: <input type="location" id="location" name="location" required></td>
                    </tr>
                </table>
                <button>Submit</button>
            </form>
        </div>
    </div>
</body>

</html>
