<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Food | HungerFree</title>

    <link rel="stylesheet" href="donor.css?v=2">
</head>

<body>

    <div class="sidebar">

        <h2>HungerFree</h2>

        <a href="donor_dashboard.html">🏠 Dashboard</a>

        <a href="donor_food.html" class="active">🍱 Donate Food</a>

        <a href="donation_history.html">📜 Donation History</a>

        <a href="profile.html">👤 My Profile</a>

        <a href="../login.html">🚪 Logout</a>

    </div>

    <div class="main-content">

        <h1>Donate Food</h1>

        <p>Fill in the details below to donate surplus food.</p>

        <form id="donationForm">

            <!-- Food Name & Category -->
            <div class="form-row">

                <div class="form-group">
                    <label>Food Name</label>
                    <input
                        type="text"
                        id="foodName"
                        placeholder="Rice, Dal, Bread..."
                        required>
                </div>

                <div class="form-group">
                    <label>Food Category</label>

                    <select id="foodCategory" required>
                        <option value="">Select Category</option>
                        <option value="Veg">Veg</option>
                        <option value="Non-Veg">Non-Veg</option>
                        <option value="Packed Food">Packed Food</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Others">Others</option>
                    </select>

                </div>

            </div>

            <!-- Quantity & Cooking Date -->
            <div class="form-row">

                <div class="form-group">
                    <label>Quantity</label>

                    <input
                        type="text"
                        id="quantity"
                        placeholder="20 Kg / 50 Packets"
                        required>
                </div>

                <div class="form-group">
                    <label>Cooking Date</label>

                    <input
                        type="date"
                        id="cookingDate"
                        required>
                </div>

            </div>

            <!-- Expiry Time -->
            <div class="form-row">

                <div class="form-group">
                    <label>Expiry Time</label>

                    <input
                        type="time"
                        id="expiryTime"
                        required>
                </div>

            </div>

            <!-- Additional Notes -->
            <div class="form-group">

                <label>Additional Notes</label>

                <textarea
                    id="additionalNotes"
                    rows="4"
                    placeholder="Any special instructions (Optional)"></textarea>

            </div>

            <!-- Food Image -->
            <div class="form-group">

                <label>Upload Food Image</label>

                <input
                    type="file"
                    id="foodImage"
                    accept="image/*">

            </div>

            <!-- Buttons -->
            <div class="button-group">

                <button type="submit">Donate Food</button>

                <button type="reset">Clear Form</button>

            </div>

        </form>

    </div>

    <script src="../js/donor_food.js"></script>

</body>

</html>
