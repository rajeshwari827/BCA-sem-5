<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Food | HungerFree</title>

    <link rel="stylesheet" href="donor.css">
</head>

<body>

    <div class="sidebar">

        <h2>🍽 HungerFree</h2>

        <a href="donor_dashboard.html">🏠 Dashboard</a>

        <a href="donor_food.html" class="active">🍱 Donate Food</a>

        <a href="donation_history.html">📜 Donation History</a>

        <a href="profile.html">👤 My Profile</a>

        <a href="../login.html">🚪 Logout</a>

    </div>

    <div class="main-content">

        <h1>Donate Food</h1>

        <p>Fill in the details below to donate surplus food.</p>

        <form action="#" method="post" enctype="multipart/form-data">

            <div class="form-row">

                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" placeholder="Enter Restaurant Name" required>
                </div>

                <div class="form-group">
                    <label>Owner Name</label>
                    <input type="text" placeholder="Enter Owner Name" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Food Name</label>
                    <input type="text" placeholder="Rice, Dal, Bread..." required>
                </div>

                <div class="form-group">
                    <label>Food Category</label>

                    <select required>
                        <option>Select Category</option>
                        <option>Veg</option>
                        <option>Non-Veg</option>
                        <option>Packed Food</option>
                        <option>Bakery</option>
                        <option>Beverages</option>
                        <option>Others</option>
                    </select>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="text" placeholder="20 Kg / 50 Packets" required>
                </div>

                <div class="form-group">
                    <label>Cooking Date</label>
                    <input type="date" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Expiry Time</label>
                    <input type="time" required>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" placeholder="Enter Contact Number" required>
                </div>

            </div>

            <div class="form-group">

                <label>Pickup Address</label>

                <textarea rows="4" placeholder="Enter Complete Address" required></textarea>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Enter City" required>
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" placeholder="Enter Pincode" required>
                </div>

            </div>

            <div class="form-group">

                <label>Additional Notes</label>

                <textarea rows="4" placeholder="Any special instructions (Optional)"></textarea>

            </div>

            <div class="form-group">

                <label>Upload Food Image</label>

                <input type="file">

            </div>

            <div class="button-group">

                <button type="submit">Donate Food</button>

                <button type="reset">Clear Form</button>

            </div>

        </form>

    </div>

</body>

</html>
