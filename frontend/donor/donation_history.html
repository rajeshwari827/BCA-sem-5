<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation History | HungerFree</title>

    <link rel="stylesheet" href="donor.css?v=2">
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>🍽 HungerFree</h2>

        <a href="donor_dashboard.html">🏠 Dashboard</a>

        <a href="donor_food.html">🍱 Donate Food</a>

        <a href="donation_history.html" class="active">📜 Donation History</a>

        <a href="profile.html">👤 My Profile</a>

        <a href="../login.html" id="logoutBtn">🚪 Logout</a>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <h1>Donation History</h1>

        <p>View all your donated food records.</p>


        <!-- Search and Filter -->

        <div class="top-controls">

            <input type="text" id="searchFood" placeholder="Search Food Name">

            <select id="statusFilter">

                <option value="All">All Status</option>

                <option value="Pending">Pending</option>

                <option value="Accepted">Accepted</option>

                <option value="Picked Up">Picked Up</option>

                <option value="Rejected">Rejected</option>

            </select>

        </div>


        <!-- Donation Table -->

        <table>

            <thead>

                <tr>

                    <th>Donation ID</th>

                    <th>Food Name</th>

                    <th>Quantity</th>

                    <th>Pickup Time</th>

                    <th>Date</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="donationHistoryBody">

                <tr>

                    <td colspan="6">
                        Loading donation history...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- JavaScript -->

    <script src="../js/donation_history.js"></script>

</body>

</html>
