<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration - HungerFree</title>

    <link rel="stylesheet"
          href="css/login.css">

    <script src="js/donor_registration.js"
            defer></script>

</head>

<body>

    <div class="page">

        <div class="navbar2">

            <a href="index.html"
               class="nav-btn">
                Home Page
            </a>

            <a href="login.html"
               class="nav-btn">
                Login
            </a>

            <a href="ngo_registration.html"
               class="nav-btn">
                Food Receiver
            </a>

        </div>


        <div class="login-box">

            <h1>DONOR REGISTRATION</h1>


            <form id="donorForm">

                <table>

                    <tr>

                        <td>
                            Name of Restaurant/Hotel:
                        </td>

                        <td>
                            <input
                                type="text"
                                id="restaurant_name"
                                name="restaurant_name"
                                placeholder="Enter Name of Restaurant/Hotel"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Name of Owner:
                        </td>

                        <td>
                            <input
                                type="text"
                                id="owner_name"
                                name="owner_name"
                                placeholder="Enter Name of Owner"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Email ID:
                        </td>

                        <td>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter Email ID"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Phone Number:
                        </td>

                        <td>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter Phone Number"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Address:
                        </td>

                        <td>
                            <textarea
                                id="address"
                                name="address"
                                placeholder="Enter your address"
                                required></textarea>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            City:
                        </td>

                        <td>
                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="Enter your city"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Password:
                        </td>

                        <td>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter Password"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Confirm Password:
                        </td>

                        <td>
                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Confirm Password"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Location:
                        </td>

                        <td>
                            <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="Enter Restaurant Location"
                                required>
                        </td>

                    </tr>

                </table>


                <button type="submit">
                    Register
                </button>

            </form>

        </div>

    </div>

</body>

</html>
