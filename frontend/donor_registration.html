<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Donor</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <form id="donorForm">


            <tr>
                <td>Donor ID: <input type="text" id="userId" name="userId" placeholder="Enter Donor ID" required>
                </td>
            </tr>
            <tr>
                <td>Name of Restaurant/Hotel: <input type="text" id="placeName" name="placeName"
                        placeholder="Enter Name of Restaurant/Hotel" required>
                </td>
            </tr>
            <tr>
                <td>Name of Owner: <input type="text" id="userName" name="userName" placeholder="Enter Name of Owner"
                        required>
                </td>
            </tr>
            <tr>
                <td>Email ID: <input type="email" id="Email" name="Email" placeholder="Enter Email ID" required>
                </td>
            </tr>
            <tr>
                <td>Phone number: <input type="text" id="phone no" name="phone no" placeholder="Enter Phone number"
                        required>
                </td>
            </tr>
            <tr>
                <td>Address: <input type="textarea" id="address" name="address" placeholder="Enter your address"
                        required>
                </td>
            </tr>
            <tr>
                <td>City: <input type="text" id="city" name="city" placeholder="Enter your city" required>
                </td>
            </tr>
            <tr>
                <td>Password: <input type="text" id="password" name="password" placeholder="Enter Password" required>
                </td>
            </tr>
            <tr>
                <td>Conform Password: <input type="text" id="conform password" name="conform password"
                        placeholder="Enter Conform Password" required>
                </td>
            </tr>
            <tr>
                <td>Location: <input type="location" id="location" name="location" required></td>
            </tr>

    <h1>REGISTER AS DONOR</h1>


    <table>

        <tr>
            <td>Restaurant Name:</td>
            <td><input type="text" id="restaurant_name" required></td>
        </tr>

        <tr>
            <td>Owner Name:</td>
            <td><input type="text" id="owner_name" required></td>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email" id="email" required></td>
        </tr>

        <tr>
            <td>Phone:</td>
            <td><input type="text" id="phone" required></td>
        </tr>

        <tr>
            <td>Address:</td>
            <td><input type="text" id="address" required></td>
        </tr>

        <tr>
            <td>City:</td>
            <td><input type="text" id="city" required></td>
        </tr>

        <tr>
            <td>Password:</td>
            <td><input type="password" id="password" required></td>
        </tr>

        <tr>
            <td>Confirm Password:</td>
            <td><input type="password" id="confirm_password" required></td>
        </tr>

        <tr>
            <td>Location:</td>
            <td><input type="text" id="location" required></td>
        </tr>

    </table>

    <button type="submit">Register</button>

</form>

<script src="js/donor_registration.js"></script>
</body>

</html>
